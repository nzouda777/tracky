# Shopify app configuration (public OAuth app).
#
# This is a TEMPLATE for one app, not the app the deployment runs on: Tracky
# holds many Shopify apps at once and each store records which one it uses, in
# `stores.api_key` / `stores.api_secret`. Copy these settings into every app
# you create in the Partner dashboard — the URLs below are identical for all of
# them, because each request identifies its app from the shop domain.
#
# Deploy with `shopify app deploy`, or mirror these values in the Partner
# dashboard. Replace APP_URL with your deployed origin.

name = "Tracky"
# One per app. Enter the same value in Tracky when adding the store.
client_id = "REPLACE_WITH_THIS_APP_CLIENT_ID"
application_url = "https://APP_URL"
embedded = false

[access_scopes]
scopes = "read_orders,write_orders,read_fulfillments,write_fulfillments"

[auth]
redirect_urls = [ "https://APP_URL/api/shopify/callback" ]

# Public tracking page served on the merchant's own domain:
#   https://<merchant-domain>/apps/track-order
# Shopify forwards the request (with a `signature` query parameter) to the URL
# below, and the route verifies that signature before rendering anything.
[app_proxy]
url = "https://APP_URL/proxy/track-order"
subpath = "track-order"
prefix = "apps"

[webhooks]
api_version = "2025-07"

  [[webhooks.subscriptions]]
  topics = [ "orders/create", "orders/updated", "orders/cancelled", "fulfillments/create", "app/uninstalled" ]
  uri = "https://APP_URL/api/shopify/webhooks"
