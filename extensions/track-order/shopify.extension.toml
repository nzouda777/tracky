# "Track my order" on Shopify's thank-you page.
#
# Deployed with the Shopify CLI (`shopify app deploy`), not with the Next app:
# the bundle lives on Shopify, not on Vercel. It has to be deployed once per
# Shopify app — this platform holds several, and an extension belongs to the
# app it was deployed under.
#
# After deploying, the merchant adds the block once in
# Settings → Checkout → Customize → Thank you page → Add app block.

api_version = "2025-07"

[[extensions]]
type = "ui_extension"
name = "Track my order"
handle = "track-order"
uid = "fd7c6774-6350-1e2d-c5ba-de384bc5254f867aaacb"

  [[extensions.targeting]]
  module = "./src/ThankYou.tsx"
  target = "purchase.thank-you.block.render"

  # Wording is the merchant's, not ours: their store, their voice. Blank falls
  # back to the defaults in the component.
  [extensions.settings]

    [[extensions.settings.fields]]
    key = "heading"
    type = "single_line_text_field"
    name = "Heading"
    description = "Leave blank for “Follow your delivery”."

    [[extensions.settings.fields]]
    key = "body"
    type = "multi_line_text_field"
    name = "Supporting text"
    description = "One line explaining what the customer will see."

    [[extensions.settings.fields]]
    key = "action"
    type = "single_line_text_field"
    name = "Button label"
    description = "Leave blank for “Track my order”."
